<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanPlan - Metas</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/metas.css" />
  </head>

  <body>
    <header id="site-header"></header>

    <main>
      <div class="content">
        <div class="page-header">
          <div>
            <h1>Metas Financeiras</h1>
            <p>Acompanhe seus objetivos de economia</p>
          </div>
          <button class="btn-nova">
            <span class="material-icons">add</span>
            Nova Meta
          </button>
        </div>

        <div class="resumo-grid metas-resumo-grid">
          <div class="resumo-card">
            <div class="resumo-icon">
              <span class="material-icons">trending_up</span>
            </div>
            <div class="resumo-info">
              <span class="resumo-label">Total Economizado</span>
              <span class="resumo-valor" id="total-economizado">R$ 0,00</span>
              <span class="resumo-sub" id="total-economizado-sub"
                >de R$ 0,00</span
              >
            </div>
          </div>

          <div class="resumo-card saldo">
            <div class="resumo-icon">
              <span class="material-icons">track_changes</span>
            </div>
            <div class="resumo-info">
              <span class="resumo-label">Metas Ativas</span>
              <span class="resumo-valor" id="metas-ativas">0</span>
            </div>
          </div>

          <div class="resumo-card qtd">
            <div class="resumo-icon">
              <span class="material-icons">emoji_events</span>
            </div>
            <div class="resumo-info">
              <span class="resumo-label">Concluídas</span>
              <span class="resumo-valor" id="metas-concluidas">0</span>
            </div>
          </div>
        </div>

        <div class="metas-grid" id="metas-grid"></div>
      </div>
    </main>

    <div class="modal-overlay" id="modal-meta">
      <div class="modal">
        <div class="modal-header">
          <h2>Nova Meta</h2>
          <button class="modal-fechar" id="modal-meta-fechar" type="button">
            <span class="material-icons">close</span>
          </button>
        </div>

        <form class="modal-body" id="form-meta">
          <div class="form-grupo">
            <label for="meta-titulo">Título</label>
            <input
              type="text"
              id="meta-titulo"
              placeholder="Ex: Reserva de Emergência"
              required
            />
          </div>

          <div class="form-grupo">
            <label for="meta-descricao">Descrição (opcional)</label>
            <input
              type="text"
              id="meta-descricao"
              placeholder="Ex: Para imprevistos"
            />
          </div>

          <div class="form-linha">
            <div class="form-grupo">
              <label for="meta-valor-alvo">Valor alvo (R$)</label>
              <input
                type="number"
                id="meta-valor-alvo"
                step="0.01"
                min="0.01"
                required
              />
            </div>

            <div class="form-grupo">
              <label for="meta-valor-atual">Valor já guardado (R$)</label>
              <input
                type="number"
                id="meta-valor-atual"
                step="0.01"
                min="0"
                value="0"
              />
            </div>
          </div>

          <div class="form-linha">
            <div class="form-grupo">
              <label for="meta-data-limite">Data limite (opcional)</label>
              <input type="date" id="meta-data-limite" />
            </div>

            <div class="form-grupo">
              <label for="meta-icone">Ícone (Material Icons)</label>
              <input
                type="text"
                id="meta-icone"
                placeholder="Ex: flight, home, shield"
              />
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn-cancelar" id="btn-cancelar-meta" type="button">
              Cancelar
            </button>
            <button class="btn-salvar" type="submit">
              <span class="material-icons">check</span>
              Salvar Meta
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="scripts/header.js"></script>
    <script type="module" src="scripts/metas.js"></script>
  </body>
</html>
