<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FinanPlan - Dashboard</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="styles/header.css" />

    <link rel="stylesheet" href="styles/dashboard.css" />
  </head>

  <body>
    <header id="site-header"></header>

    <main>
      <section class="middle">
        <div class="header">
          <div>
            <h1 class="title">Dashboard</h1>

            <p id="visao">Visão geral das suas finanças</p>
          </div>
        </div>

        <div class="cards">
          <div class="card">
            <h3>Saldo Total</h3>

            <h2 id="saldo-total">R$ 0,00</h2>

            <span class="positivo"> +12% vs mês anterior </span>
          </div>

          <div class="card">
            <h3>Receitas</h3>

            <h2 id="receitas">R$ 0,00</h2>

            <span class="positivo"> Receitas do período </span>
          </div>

          <div class="card">
            <h3>Despesas</h3>

            <h2 id="despesas">R$ 0,00</h2>

            <span class="negativo"> Despesas do período </span>
          </div>

          <div class="card">
            <h3>Meta de Economia</h3>

            <h2 id="meta-economia">R$ 0,00</h2>

            <span class="positivo"> 30% do saldo </span>
          </div>
        </div>

        <div class="card-transacoes">
          <div class="transacoes">
            <div class="transacoes-topo">
              <div>
                <h2>Transações Recentes</h2>

                <p>Suas últimas movimentações</p>
              </div>

              <a href="transacoes.html" class="ver-todas">
                Ver todas

                <span class="material-icons">arrow_forward</span>
              </a>
            </div>

            <div class="lista-transacoes" id="transacoes-recentes"></div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="scripts/header.js"></script>

    <script type="module" src="scripts/dashboard.js"></script>
  </body>
</html>
